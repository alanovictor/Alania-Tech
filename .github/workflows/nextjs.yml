name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Permite rodar manualmente pela aba "Actions" no GitHub, sem precisar de um novo commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações rodando ao mesmo tempo.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Definir o basePath (subpasta do GitHub Pages)
        id: basepath
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          # Repositórios do tipo "usuario.github.io" publicam na raiz do domínio,
          # então não usam basePath. Qualquer outro repositório é publicado em
          # https://usuario.github.io/nome-do-repositorio/, então precisa do prefixo.
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Build (exportação estática)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}

      - name: Garantir o arquivo .nojekyll na saída
        run: touch ./out/.nojekyll

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato de build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
